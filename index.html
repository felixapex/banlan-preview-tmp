<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的移动端 · 建站助手</title>
<meta name="robots" content="noindex">
<script src="./qr-encode.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
body{background:#2b2622 url(bg.webp) center/cover;padding:16px;display:flex;gap:12px}
.card{background:#fff;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.ed{flex:1;min-width:0;background:#F5F6F8}.as{flex:0 0 520px}
.tb{display:flex;align-items:center;gap:8px;padding:16px 16px 0}
.b{height:32px;border-radius:4px;display:flex;align-items:center;font-size:13px;line-height:1;white-space:nowrap;cursor:pointer;padding:0 14px;border:1px solid #E0E0E0;background:#fff;color:#111}
.b:hover{background:#F5F6F7}.b.p{background:#0B36F4;border-color:#0B36F4;color:#fff;padding:0 18px}
.acc{height:32px;border-radius:6px;display:flex;align-items:center;padding:0 12px;font-size:13px;cursor:pointer;border:1px dashed rgba(0,0,0,.28);color:#111;background:#fff}
.acc:hover{background:#F5F6F7}.acc.on{border:1px solid #0B36F4;color:#0B36F4}
.dd{position:relative}.ddt{height:32px;border-radius:6px;background:#fff;border:1px dashed rgba(0,0,0,.28);display:flex;align-items:center;gap:8px;padding:0 10px 0 12px;font-size:13px;color:#111;cursor:pointer;white-space:nowrap}.ddt:hover{background:#F5F6F7}
.ddm{position:absolute;left:0;top:38px;z-index:41;min-width:190px;border-radius:6px;background:#fff;border:.87px solid rgba(0,0,0,.1);box-shadow:0 8px 28px rgba(0,0,0,.14);padding:6px 0;display:none}.ddm.open{display:block}
.mi{height:34px;padding:0 14px;display:flex;align-items:center;font-size:13.5px;color:rgba(0,0,0,.75);cursor:pointer;white-space:nowrap}.mi:hover{background:#f4f4f4}.mi.on{background:#e6e6e6;color:#000}
.ddc{position:fixed;inset:0;z-index:40;display:none}.ddc.open{display:block}
.stage{flex:1;min-height:0;overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:12px 0 16px}
.phone{flex:0 0 auto;width:375px;height:812px;margin:0;border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.12);display:flex;flex-direction:column}
.sbar{flex:0 0 44px;padding:0 22px 0 28px;display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:600;color:#111}.sbar span{display:flex;gap:5px;align-items:center}
.phone iframe{flex:1;min-height:0;width:375px;border:0;display:block}
.ah{height:52px;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid rgba(0,0,0,.06);font-size:14px;color:#111}
.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.bub{max-width:88%;padding:12px 14px;border-radius:10px;font-size:13px;line-height:1.7;color:#111}
.bub.ai{background:#fff;border:1px solid rgba(0,0,0,.08);align-self:flex-start}.bub.me{background:#EEF2FF;align-self:flex-end}
.cp{margin:0 16px 16px;border:1px solid rgba(0,0,0,.12);border-radius:12px;padding:10px 12px;display:flex;align-items:flex-end;gap:8px}
.cp textarea{flex:1;border:0;outline:0;resize:none;font:inherit;font-size:13px;height:44px;line-height:1.6}
.send{width:32px;height:32px;border-radius:50%;background:#0B36F4;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50}
.dlg{width:560px;max-width:92vw;max-height:86vh;overflow:auto;background:#fff;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:12px}
.dt{font-size:16px;font-weight:600;color:#111}.dd{font-size:12.5px;color:rgba(0,0,0,.55);line-height:1.6}
.tbl{border:1px solid rgba(0,0,0,.08);border-radius:8px;overflow:hidden}.tr{display:flex;align-items:center;min-height:40px;border-top:1px solid rgba(0,0,0,.06);font-size:13px;color:#111}
.tr.h{background:#F5F6F8;font-size:12.5px;color:rgba(0,0,0,.6);min-height:36px;border-top:0}.tr span{padding:6px 8px}
.btns{display:flex;justify-content:flex-end;gap:8px}.btn{height:34px;padding:0 16px;border-radius:8px;border:1px solid rgba(0,0,0,.12);display:flex;align-items:center;font-size:13.5px;cursor:pointer;color:#111;background:#fff}.btn.p{background:#0B36F4;border-color:#0B36F4;color:#fff;padding:0 18px}
.tabs{display:flex;gap:20px;border-bottom:1px solid rgba(0,0,0,.08)}.tab{padding:8px 0;font-size:13.5px;cursor:pointer;color:rgba(0,0,0,.6);border-bottom:2px solid transparent}.tab.on{color:#0B36F4;border-color:#0B36F4}
.empty{padding:28px 0;text-align:center;font-size:13px;color:rgba(0,0,0,.45)}
.toast{position:fixed;left:50%;top:40px;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;font-size:13px;padding:8px 14px;border-radius:8px;display:none;z-index:60}
</style></head><body>
<div class="card ed">
 <div class="tb" id="tb"></div>
 <div class="stage"><div class="phone">
  <iframe id="fr" title="小程序预览"></iframe></div></div>
</div>
<div class="card as">
 <div class="ah"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="4" y="7" width="16" height="12" rx="4" fill="#0B36F4"/><circle cx="9.5" cy="13" r="1.6" fill="#fff"/><circle cx="14.5" cy="13" r="1.6" fill="#fff"/><path d="M12 4v3" stroke="#0B36F4" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="3.5" r="1.4" fill="#0B36F4"/></svg>建站助手</div>
 <div class="msgs" id="msgs"></div>
 <div class="cp"><textarea id="tx" placeholder="告诉建站助手要怎么改，比如：首页第一张图换成 G325"></textarea><div class="send" id="send"><svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
</div>
<div class="mask" id="mask"><div class="dlg" id="dlg"></div></div><div class="toast" id="toast"></div>
<script>
const APPS=[{id:'yuhu',type:'mini',name:'御虎家居',url:'http://47.99.172.82:8080',src:'yuhu.html'},{id:'banlan',type:'app',name:'班兰家居',url:'',src:'banlan.html'}];
const K='mmstand.v1';
let D;try{D=JSON.parse(localStorage.getItem(K))}catch(e){}
D=D||{cur:'yuhu',drafts:{},pubs:{yuhu:[{t:'2026-11-26 07:19',by:'总部',note:'订货单流程统一、输入框加大、自动保存'}]},logs:{}};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}};
const app=()=>APPS.find(a=>a.id===D.cur);const label=a=>(a.type==='app'?'APP':'小程序')+'：'+a.name;
const L=(o,k)=>(o[k]=o[k]||[]);const now=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){toast.el=document.getElementById('toast');toast.el.textContent=t;toast.el.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>toast.el.style.display='none',1800)}
function render(){const a=app(),dr=L(D.drafts,a.id);
 tb.innerHTML=`<div class="ddc" data-dc></div><div class="dd"><div class="ddt" data-dd>${label(a)}<svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2 3.6l3 3 3-3" stroke="rgba(0,0,0,.6)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="ddm">${APPS.map(x=>`<div class="mi${x.id===a.id?' on':''}" data-a="${x.id}">${label(x)}</div>`).join('')}</div></div>`+'<div style="flex:1"></div>'+(dr.length?`<div class="b" data-k="draft">草稿箱 ${dr.length}</div>`:'')+'<div class="b" data-k="set">设置</div><div class="b" data-k="qr">扫码预览</div><div class="b p" data-k="pub">发布</div>';
 if(fr.getAttribute('src')!==a.src)fr.setAttribute('src',a.src);
 msgs.innerHTML=`<div class="bub ai">告诉我「${esc(a.name)}」要怎么改，比如：首页第一张图换成 G325、某个产品改价格。改动先放进「草稿箱」，点「发布」后客户才看得到。</div>`+dr.map(m=>`<div class="bub me">${esc(m.what)}</div><div class="bub ai">已记下，放进草稿箱了。点「发布」后客户才看得到。</div>`).join('');msgs.scrollTop=1e6}
tb.onclick=e=>{if(e.target.closest('[data-dd]')){tb.querySelector('.ddm').classList.toggle('open');tb.querySelector('.ddc').classList.toggle('open');return}if(e.target.closest('[data-dc]')){render();return}const t=e.target.closest('[data-a],[data-k]');if(!t)return;if(t.dataset.a){D.cur=t.dataset.a;save();render();return}open(t.dataset.k)};
function send(){const v=tx.value.trim();if(!v)return;L(D.drafts,D.cur).push({t:now(),what:v,by:'我'});tx.value='';save();render()}
document.getElementById('send').onclick=send;tx.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};
let tabK='perm';
function open(k){const a=app(),dr=L(D.drafts,a.id);let h='';
 if(k==='pub'&&!dr.length){toast('草稿箱是空的，没有要发布的修改');return}
 if(k==='draft'){h=`<div class="dt">草稿箱 · ${label(a)}</div><div class="dd">对建站助手说的修改先放在这里，点「发布」后客户才看得到。</div>`+(dr.length?`<div class="tbl"><div class="tr h"><span style="flex:0 0 48px;text-align:center">序号</span><span style="flex:0 0 140px">时间</span><span style="flex:1">修改内容</span><span style="flex:0 0 60px">修改人</span></div>${dr.map((r,i)=>`<div class="tr"><span style="flex:0 0 48px;text-align:center">${i+1}</span><span style="flex:0 0 140px;color:rgba(0,0,0,.6)">${r.t}</span><span style="flex:1">${esc(r.what)}</span><span style="flex:0 0 60px">${r.by}</span></div>`).join('')}</div>`:'<div class="empty">草稿箱是空的</div>')+`<div class="btns"><div class="btn" data-c>关闭</div>${dr.length?'<div class="btn p" data-go="pub">发布</div>':''}</div>`}
 if(k==='pub'){h=`<div class="dt">确认发布</div><div style="font-size:13px;color:rgba(0,0,0,.65);line-height:1.7">要把草稿箱里的 ${dr.length} 条修改发布到「${label(a)}」吗？发布后客户马上看到，原来的版本会留在「设置 › 发布记录」里。</div><div class="btns"><div class="btn" data-c>取消</div><div class="btn p" data-do="pub">确认发布</div></div>`}
 if(k==='qr'){let img='';if(a.url&&window.qrEncode){const {size,modules}=qrEncode(a.url),q=4,sc=8,px=(size+q*2)*sc,cv=document.createElement('canvas');cv.width=cv.height=px;const c=cv.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,px,px);c.fillStyle='#000';for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(modules[y][x])c.fillRect((x+q)*sc,(y+q)*sc,sc,sc);img=`<img src="${cv.toDataURL()}" style="width:200px;height:200px;align-self:center">`}
  h=`<div class="dt">扫码预览 · ${label(a)}</div>${img||'<div class="empty">还没有线上地址，上线后这里出二维码</div>'}<div class="dd" style="text-align:center">${a.url?esc(a.url):''}</div><div class="btns"><div class="btn" data-c>关闭</div></div>`}
 if(k==='set'){const T=[['perm','权限'],['pubs','发布记录'],['logs','修改记录']],P=L(D.pubs,a.id),G=L(D.logs,a.id);
  h=`<div class="dt">设置 · ${label(a)}</div><div class="tabs">${T.map(([x,n])=>`<div class="tab${x===tabK?' on':''}" data-t="${x}">${n}</div>`).join('')}</div>`;
  if(tabK==='perm')h+='<div class="dd">主账号默认全部权限；子账号按这个小程序分开设。给「发布」会自动带上「编辑」「查看」。</div><div class="empty">还没有子账号（在「后台管理 › 子账号管理」添加）</div>';
  if(tabK==='pubs')h+=P.length?`<div class="tbl"><div class="tr h"><span style="flex:0 0 140px">发布时间</span><span style="flex:0 0 60px">发布人</span><span style="flex:1">内容</span></div>${P.slice().reverse().map(r=>`<div class="tr"><span style="flex:0 0 140px;color:rgba(0,0,0,.6)">${r.t}</span><span style="flex:0 0 60px">${r.by}</span><span style="flex:1">${esc(r.note)}</span></div>`).join('')}</div>`:'<div class="empty">还没有发布过</div>';
  if(tabK==='logs')h+=G.length?`<div class="tbl"><div class="tr h"><span style="flex:0 0 140px">时间</span><span style="flex:1">修改内容</span><span style="flex:0 0 60px">修改人</span><span style="flex:0 0 60px">状态</span></div>${G.slice().reverse().map(r=>`<div class="tr"><span style="flex:0 0 140px;color:rgba(0,0,0,.6)">${r.t}</span><span style="flex:1">${esc(r.what)}</span><span style="flex:0 0 60px">${r.by}</span><span style="flex:0 0 60px">已发布</span></div>`).join('')}</div>`:'<div class="empty">还没有修改记录</div>';
  h+='<div class="btns"><div class="btn" data-c>关闭</div></div>'}
 dlg.innerHTML=h;mask.style.display='flex';dlg.dataset.k=k}
mask.onclick=e=>{if(e.target===mask||e.target.closest('[data-c]')){mask.style.display='none';return}
 const g=e.target.closest('[data-go]');if(g){open(g.dataset.go);return}
 const t=e.target.closest('[data-t]');if(t){tabK=t.dataset.t;open('set');return}
 if(e.target.closest('[data-do]')){const a=app(),dr=L(D.drafts,a.id),t=now();L(D.pubs,a.id).push({t,by:'我',note:dr.map(x=>x.what).join('；')});dr.forEach(x=>L(D.logs,a.id).push(x));D.drafts[a.id]=[];save();mask.style.display='none';render();toast('已发布')}};
render();
</script></body></html>
